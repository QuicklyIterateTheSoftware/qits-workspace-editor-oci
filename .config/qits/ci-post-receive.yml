# The pipeline qits-ci runs on every push to a tracked branch of this repository.
#
# Two steps. The first runs on every branch; the second runs on `maintenance/` alone:
#
#   1. build the image and push it under the built sha.
#   2. release the branch — the bump train's last leg, described at the bottom of this comment.
#
# THERE IS NO TEST STEP AND NOTHING IS MISSING. This repository holds a Dockerfile and no code: no
# pom, no package.json, nothing a `verify` could run. The build IS the test — a broken `FROM`, a
# moved download URL, a re-uploaded release asset with a different checksum, all fail here on the
# push that caused them rather than at release time when the answer arrives with nothing to do
# about it.
#
# THE IMAGE NAME IS NOT THE REPOSITORY NAME. This publishes `qits/workspace-editor`, the same split
# `qits-workspace-oci` publishing `qits/workspace-base` and `qits-workspace-daemon` publishing
# `qits/workspace` already record: the repository name is where the recipe lives, the image name is
# what the recipe produces and what qits-workspaces writes when it starts a container from it.
#
# ONE TAG PER PIPELINE. Do not add a second `-t` and a second push here. A sibling repository tried
# `docker build -t A -t B` then pushed both, and the second push failed with "tag does not exist":
# BuildKit's exporter does not reliably leave every alias of a multi-tag build in the local image
# store. Split the coordinates instead — this pipeline owns the sha, ci-event-release.yml owns the
# version.
#
# WHY THE IMAGE STEP DECLARES `docker: true`: it hands the step the HOST daemon's socket, which is
# the side this Dockerfile is written for. Its base — the pinned `qits/workspace` on
# `registry.dev.localhost:8080` — is an address the host daemon resolves and nothing inside this
# step's container can.
#
# No `--network` flag. The build does dial the internet (the openvscode-server tarball comes from
# GitHub) but it dials nothing on the PLATFORM, which is what that flag is ever added for: the
# default bridge reaches the outside, and the one platform address in the Dockerfile is the base
# reference, which is the host daemon's to pull and not the build's.
#
# No `--secret` flags either. This build mounts no credential — no Maven resolve, no npm install, no
# platform repository — so there is nothing for buildx to feed. The sibling image builds carry the
# commissioned pair because their builder stages might need it; this one has no builder stage.
#
# THE TIMEOUT IS THE SIBLINGS'. The base alone is the ~3.4 GB workspace image, pulled and pushed
# again with one layer on top, plus a ~77 MB download. images/qits-oci-workspace found an hour short
# of headroom for those bytes on a cold cache and qits-workspace-daemon matched it; there is no
# reason for this repository to be the optimist.
#
# THE SECOND STEP IS WHAT CLOSES THE BUMP TRAIN'S LOOP. ci-event-upstream-workspace-daemon.yml
# follows a `qits/workspace` release by rewriting the base pin in Dockerfile and pushing
# `maintenance/qits-workspace-daemon`. That push lands here, this step releases the repository, and
# the release republishes the editor image on the new workspace — with nobody in the loop. Without
# this step the train would push a branch and stop there: green build, no release, no announcement,
# nobody told.
steps:
  - image: qits/build-images/ci-base:latest
    docker: true
    timeout-seconds: 7200
    script: |
      # `set -eu` is load-bearing rather than tidy: the daemon runs the script with `bash -c` and no
      # -e, so without it a failed build is swallowed by the next command's exit code — the push
      # fails or runs on a stale local image, and the run reports SUCCESS for an image that was never
      # built. -u makes an unset registry variable stop the step rather than composing a reference
      # out of empty strings.
      set -eu
      ref="$QITS_REGISTRY/$QITS_IMAGE_REPOSITORY/workspace-editor:$QITS_CI_SHA"
      docker build -t "$ref" -f Dockerfile .
      docker push "$ref"
      # NO `docker rmi "$ref"`: on a CI host it frees nothing — the layers stay in the builder's
      # cache either way — while under the containerd image store it drops the last reference to
      # content a concurrent build of this same Dockerfile may still be resolving. Two builds of
      # this one Dockerfile do run concurrently, main's and environment/dev's, which is the race
      # that broke the release of 2026-08-11.

    # node-base, not ci-base: the POST below goes through node because node has `fetch` built in and
    # ci-base promises no curl-with-json ergonomics worth the difference. No docker socket — this
    # step builds nothing.
    #
    # `branches:` is what keeps it off main. Every push to a tracked branch runs the step above;
    # only a `maintenance/` push runs this one, so an ordinary commit never calls the release
    # endpoint.
  - image: qits/build-images/node-base:latest
    branches:
      - prefix: maintenance/
    timeout-seconds: 300
    script: |
      # Same reason as the step above: `bash -c` with no -e would let a failed release call be
      # swallowed by the next command's exit code.
      set -eu

      # Belt and braces over `branches:` above. The selector is qits-ci's and this guard is the
      # step's own, so a selector that ever widens cannot silently release main.
      case "$QITS_CI_BRANCH" in
        maintenance/*) ;;
        *) echo "not a maintenance branch: $QITS_CI_BRANCH"; exit 1 ;;
      esac

      # The bump commit's subject, reused verbatim as the release summary. It is under the summary
      # field's 100 characters by construction — the bump pipeline's convention is what keeps it so.
      summary=$(git log -1 --format=%s)

      # RELEASE, not merge and not integrate. Releasing is the only door onto main: it stamps a
      # version, writes one two-parent commit and pushes the annotated tag — which is the fact
      # ci-event-release.yml waits for. It publishes SCMRelease as well, and that is what turns the
      # green release run into an announcement. Integrating targets the branch's PARENT and would
      # refuse with RELEASE_REQUIRED when that parent is main.
      #
      # The step self-identifies entirely from injected environment, so no deployment address is
      # spelled here: $QITS_WORKSPACES_URL is qits-workspaces' root (scheme, host and port, no path
      # — the path is the caller's to spell), and $QITS_CI_PROJECT_ID, $QITS_CI_REPO_NAME and
      # $QITS_CI_BRANCH are this run's.
      #
      # AUTHORIZATION. The release door is machine-authenticated — qits-workspaces runs with
      # QITS_AUTH_MACHINE_REQUIRED=true — so an unauthenticated POST is answered 401 and this step
      # goes red with `release refused: HTTP 401`. That is exactly how the fleet's bump trains failed
      # silently for a week after machine auth was switched on: the only leg that fails is the last
      # one, so each bump landed on its branch and quietly stayed there.
      #
      # THE CREDENTIAL IS THIS RUN'S OWN, never a secret written down here: qits-ci commissions an
      # idp client per run and injects it as $QITS_COMMISSIONED_CLIENT_ID and
      # $QITS_COMMISSIONED_CLIENT_SECRET, short-lived and revoked at teardown, which is what makes it
      # the only credential a step authored in a repository is allowed to hold.
      # $QITS_GIT_AUTH_TOKEN_URL is the idp's token endpoint — the name says "git" because git's
      # helper was its first caller.
      #
      # THE AUDIENCE IS DERIVED, not spelled. A token is cut FOR one service and qits-workspaces
      # refuses one cut for anyone else, so the mint has to name it — and the name is the host of
      # $QITS_WORKSPACES_URL, which is the service alias, which is what qits-workspaces checks as
      # QITS_AUTH_MACHINE_AUDIENCE. $QITS_WORKSPACES_AUDIENCE is read first so a later launcher can
      # state the audience outright without editing every repository carrying this step.
      #
      # NO PAIR, NO HEADER. A deployment that commissions nothing has no pair to exchange and has
      # machine auth off as well, so there the call goes out unauthenticated rather than dying on a
      # mint it was never going to be able to make. A pair that IS present and cannot be exchanged is
      # a broken platform rather than an unconfigured one, and that is red.
      #
      # Statuses: 200 is the receipt and prints it, a 409 saying the branch is already released is a
      # replayed push finding its work done and is a success, and everything else is red with the
      # body on screen. The body is read defensively — some refusals are a plain 400 with no
      # `reason`.
      node -e '
        const [url, branch, summary] = process.argv.slice(1);
        const env = process.env;

        const authorize = async () => {
          const id = env.QITS_COMMISSIONED_CLIENT_ID;
          const secret = env.QITS_COMMISSIONED_CLIENT_SECRET;
          const tokenUrl = env.QITS_GIT_AUTH_TOKEN_URL;
          if (!id || !secret || !tokenUrl) return {};
          const audience = env.QITS_WORKSPACES_AUDIENCE || new URL(url).hostname;
          const basic = Buffer.from(id + ":" + secret).toString("base64");
          const res = await fetch(tokenUrl, {
            method: "POST",
            headers: {
              "content-type": "application/x-www-form-urlencoded",
              authorization: `Basic ${basic}`,
            },
            body: new URLSearchParams({ grant_type: "client_credentials", audience }),
          });
          const text = await res.text();
          if (!res.ok) {
            throw new Error(`idp refused the commissioned client for ${audience}: HTTP ${res.status} ${text}`);
          }
          const token = JSON.parse(text).access_token;
          if (!token) throw new Error(`idp returned no access_token for ${audience}`);
          return { authorization: `Bearer ${token}` };
        };

        authorize().then((auth) => fetch(url, {
          method: "POST",
          headers: { "content-type": "application/json", ...auth },
          body: JSON.stringify({ branch, summary }),
        })).then(async (res) => {
          const text = await res.text();
          let body = {};
          try { body = JSON.parse(text); } catch {}
          if (res.ok) {
            console.log(`released ${body.version} as ${body.commitSha} from ${body.branch}`);
            return;
          }
          if (res.status === 409 && body.reason === "ALREADY_INTEGRATED") {
            console.log(`${branch} is already released - nothing to do`);
            return;
          }
          console.error(`release refused: HTTP ${res.status} ${text}`);
          process.exit(1);
        }).catch((err) => {
          console.error(`release call failed: ${err.message}`);
          process.exit(1);
        });
      ' "$QITS_WORKSPACES_URL/workspaces/api/branches/release?projectId=$QITS_CI_PROJECT_ID&repositoryName=$QITS_CI_REPO_NAME" \
        "$QITS_CI_BRANCH" "$summary"
