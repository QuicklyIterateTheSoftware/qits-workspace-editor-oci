# The release pipeline: this repository reacts to its OWN release TAG and publishes the version-tagged
# editor image.
#
# THE SELECTION NAMES THIS REPOSITORY, WHICH READS LIKE A LOOP AND IS NOT — the same shape every
# sibling's release pipeline has. `SCMRelease` says only "this repository released this version",
# and qits-projects says it the instant the tag is written; nothing here releases anything. qits-ci
# turns a green run
# into one `SoftwareRelease` per entry under `artifacts:` when an `SCMRelease` for the version
# arrived too, and nothing here listens for either.
#
# THE VERSION TAG IS STILL THE DURABLE STAMP, BUT IT NO LONGER TRIGGERS. Under the release-request
# flow the tag is written by qits-githost's tag primitive, which announces nothing — the trigger is
# qits-projects' `SCMRelease`. A bootstrap replay therefore re-establishes a release by pushing the
# tag quietly and re-presenting the `SCMRelease` through qits-ci's manual trigger door
# (`POST /ci/api/events/trigger`), which runs this same pipeline. qits-ci still announces
# `SoftwareRelease` only where a green run and an `SCMRelease` meet.
#
# THE FILE HAS TO BE IN PLACE BEFORE THE TAG IT SELECTS IS PUSHED. The bus is at-most-once with no
# catch-up and no replay, so a trigger file arriving after its event loses that release and looks
# like a train that quietly did not roll.
#
# The repository has no version file. A qits release creates the version and the annotated tag, and
# the tag name IS that version.
event: SCMRelease
when:
  # SCMRelease, not SCMPublishTag: under the release-request flow the version tag is written by
  # qits-githost's tag primitive, which fires no post-receive and so publishes no SCMPublishTag —
  # a recipe listening for the tag event never runs again. qits-projects' Auto Release publishes
  # SCMRelease carrying the repository's public name, and a bootstrap replay arrives as this same
  # event through qits-ci's manual trigger door. A rename updates this line in the same campaign.
  - repository: { exact: qits-workspace-editor-oci }

# A DECLARATION, NOT A REPORT. qits-ci never learns how to publish anything — the `docker push` below
# is this repository's own step — so it cannot see what landed. It announces one `SoftwareRelease` per
# entry on the strength of this line once the whole pipeline is green. Keep it true.
#
# THE NAME IS UNQUALIFIED ON PURPOSE. No registry-qualified reference is portable here — the registry
# is `qits-platform-artifacts:8080` inside a step container and `localhost:8081` to qits-ci and
# qits-deployments — and an OCI reference cannot carry a path prefix. So the declaration carries
# `qits/workspace-editor` and the reader supplies its own host, exactly as the step below composes one
# from environment.
#
# It is also the coordinate a downstream follow-bump selects on: `packageName` on the SoftwareRelease
# is this string verbatim. qits-workspaces pins the editor image by version the same way this
# repository pins the workspace image, and that pin's train reads this line.
# THE RUN IS ANCHORED AT THE TAG IT BUILDS. `SCMRelease` carries `commitSha` — the commit the tag
# points at — since qits-projects 2026.905.73500, and qits-ci resolves these two dot-paths since
# 2026.905.83431. Before that the event named no commit at all: `branch` is the release request's
# BACKING BRANCH, which the tagging operation deletes, and `version` names a tag rather than a
# commit — so this file could declare no `checkout:`, the run was recorded at `main`, and every
# release displayed as `main@<head>`, a run recorded against a commit it did not build.
#
# `branch: version` IS NOT A MISNOMER. The key is named for the run row's ref column, and a tag is a
# ref: the daemon clones `--branch "$QITS_CI_BRANCH"`, which git resolves against tags exactly as
# against heads, and the sha is what `checkout --detach` then lands on. Nothing in qits-ci holds a
# concept of a tag.
#
# `optional: true` IS THE TRANSITION AND IT STAYS UNTIL NO OLD EVENT CAN ARRIVE. `commitSha` is
# additive, so an `SCMRelease` published before it existed — a replay out of the durable log, a
# hand-built event through qits-ci's manual trigger door — resolves nothing here. Without the flag
# that would cost this pipeline its run, which is a released version whose artifact is silently
# never published. With it, such a run is recorded at `main`'s head, byte-for-byte as before, and
# the `git fetch refs/tags/$version` in the step below is what supplies the released tree — which
# is why that fetch STAYS: a no-op on the anchored path, the whole mechanism on the fallback one.
checkout:
  branch: version       # the tag's name — a ref name, which `clone --branch` resolves
  sha: commitSha        # what it points at; absent on any release published before the field
  optional: true        # ...and then this run is main's head, exactly as it was before
artifacts:
  - { type: docker, name: qits/workspace-editor }

# NO deployments.yml in this repository, and that is correct. Nothing DEPLOYS this image — qits-
# workspaces starts a container from it per workspace, the same way it starts one from
# `qits/workspace`. That is the same case as qits-workspace-oci, which has none; qits-database-oci
# has one because a database genuinely runs as a deployed service.
steps:
  - image: qits/build-images/ci-base:latest
    docker: true
    timeout-seconds: 7200
    script: |
      # The daemon runs this with `bash -c` and no -e. Without -e a failed docker build is swallowed
      # and a green release run makes qits-ci announce an artifact that was never pushed. -u makes an
      # unset registry variable stop the step.
      set -eu

      # The payload reaches the container verbatim as one string in $QITS_EVENT_PAYLOAD — there is
      # no per-field projection. ci-base carries jq; `jq -er` fails the step on an absent field
      # rather than composing a reference out of the word "null". The case guard refuses a malformed
      # value before any registry tag is created, since a CalVer is only digits and dots. It matters
      # more than it looks: the tag name IS the version now, and no release flow vetted it — any tag
      # pushed to this repository arrives here.
      version=$(printf '%s' "$QITS_EVENT_PAYLOAD" | jq -er .version)
      case "$version" in
        ''|null|*[!0-9.]*) echo "not a CalVer tag: $version" >&2; exit 1 ;;
      esac
      echo "releasing qits/workspace-editor:$version"

      # THE TAG IS THE CHECKOUT TARGET. An event-triggered run is cloned at the head of main, which
      # a later push moves; the tag does not. The clone is shallow and carries no tags, hence the
      # explicit refspec, and the URL rather than `origin` because every address arrives as
      # environment. `checkout --detach` peels the annotated tag to its commit.
      #
      # It is also what makes the base pin reproducible. `ARG WORKSPACE_IMAGE` travels with the tree,
      # so rebuilding a released tag rebuilds the editor on the workspace image that tag was released
      # with — which is the whole reason the pin is a committed line rather than a floating tag.
      git fetch "$QITS_CI_REPOSITORY_URL" "refs/tags/$version:refs/tags/$version"
      git checkout --detach "$version"

      # ONE TAG PER PIPELINE. Push only `:$version` here — never also `:latest` or the sha. A
      # sibling repository tried `docker build -t A -t B` then pushed both, and the second push
      # failed with "tag does not exist": BuildKit's exporter does not reliably leave every alias of
      # a multi-tag build in the local image store. ci-event-release-request.yml owns the sha
      # coordinate; this pipeline owns the version coordinate.
      #
      # `docker: true` and the absence of `--network`/`--secret` are ci-event-release-request.yml's,
      # and for its reasons — that file carries them at length rather than a second copy drifting
      # here.
      ref="$QITS_REGISTRY/$QITS_IMAGE_REPOSITORY/workspace-editor:$version"
      docker build -t "$ref" -f Dockerfile .
      docker push "$ref"
      # NO `docker rmi "$ref"`: on a CI host it frees nothing — the layers stay in the builder's
      # cache either way — while under the containerd image store it drops the last reference to
      # content a concurrent build of this same Dockerfile may still be resolving, which is the
      # race that broke the release of 2026-08-11.

      # --- the SBOM -------------------------------------------------------------------------------
      # THE SBOM FOR AN IMAGE LIKE THIS ONE IS ITS `FROM` LINE PLUS THE ONE THING IT ADDS, and there
      # is nothing else it honestly could be: this Dockerfile declares no manifest a scanner could
      # read. It inherits a workspace image and unpacks a single pinned tarball over it, so the
      # document says exactly that — which upstream this editor was laid on, and which
      # openvscode-server build is in /opt — and nothing it would have to invent.
      #
      # The shape is qits-workspace-oci's, which carries the reasoning for the `FROM` parsing at
      # length rather than a second copy of it drifting here. Two things are this repository's own
      # and are argued where they happen: the base is an `ARG` and has to be resolved, and the
      # tarball is a real component.
      #
      # AFTER THE PUSH AND BEFORE THE STEP EXITS, which is the ordering rule rather than a
      # preference: qits-ci announces `SoftwareRelease` only for a green run, so a document stored
      # here can never be missing for a version somebody was told about. Nothing retries the other
      # way round — qits-maintenance reads a 404 as MISSING and asks again only at the NEXT release —
      # so a failed PUT fails the release on purpose, and the tag can be re-pushed to rebuild.

      # TWO COLLECTIONS, BECAUSE `ARG` HAS TWO SCOPES AND THIS FILE USES BOTH. An `ARG` before the
      # first `FROM` is GLOBAL and is the only kind a `FROM` line may read; an `ARG` after one
      # belongs to that stage and is invisible to every `FROM`. So `global_args` quits at the first
      # `FROM` — docker's own scope rule, not an optimisation — and is what the base resolution
      # below is allowed to consult, while `stage_args` is every `ARG` in the file and is where the
      # editor's own pin actually lives: `OPENVSCODE_VERSION` is declared beside the `RUN` that uses
      # it, which is AFTER the `FROM` and therefore not global at all. One collection for both would
      # be wrong whichever one it was — the global set drops the editor, the whole-file set lets a
      # stage `ARG` resolve a base docker would never resolve it with.
      #
      # In both, the value has to be one whitespace-free word: a spaced-out or empty default is not
      # collected at all, so anything reaching for it fails loudly below instead of resolving to a
      # fragment of itself.
      arg_sed='s/^[[:space:]]*[Aa][Rr][Gg][[:space:]]\{1,\}\([A-Za-z_][A-Za-z0-9_]*\)=\([^[:space:]]\{1,\}\)[[:space:]]*$/\1=\2/p'
      global_args=$(sed -n "/^[[:space:]]*[Ff][Rr][Oo][Mm][[:space:]]/q
        $arg_sed" Dockerfile)
      stage_args=$(sed -n "$arg_sed" Dockerfile)

      # One lookup for both, taking the collection it should read as its second argument. There is
      # no `local` in POSIX sh — the daemon may run this under `sh` — so the helper only reads its
      # arguments and prints; the `_`-prefixed name keeps it clear of the loop's variables.
      arg_default() {
        for _def in $2; do
          case "$_def" in
            "$1="*) printf '%s' "${_def#*=}"; return 0 ;;
          esac
        done
        return 1
      }

      # A multi-stage file names its OWN earlier stages in later `FROM`s, and a stage alias is not
      # an upstream image. This file has one stage today and the skip below therefore removes
      # nothing; it is here so the document stays right the day it grows a builder stage.
      stages=$(sed -n \
        's/^[[:space:]]*[Ff][Rr][Oo][Mm][[:space:]].*[[:space:]][Aa][Ss][[:space:]]\{1,\}\([^[:space:]]\{1,\}\).*$/\1/p' \
        Dockerfile)
      # Every `FROM`'s image ref: drop the keyword, drop any `--platform=`-style flag, keep the
      # first word — which leaves the ref alone and discards a trailing `AS <stage>`.
      bases=$(sed -n 's/^[[:space:]]*[Ff][Rr][Oo][Mm][[:space:]]\{1,\}//p' Dockerfile \
        | sed 's/--[^[:space:]]*[[:space:]]\{1,\}//g' \
        | sed 's/[[:space:]].*$//')

      components=''
      depends=''
      seen=''
      sep=''
      for base in $bases; do
        # THE BASE HERE IS `${WORKSPACE_IMAGE}`, WHICH NEITHER SIBLING HAD TO HANDLE. Taken
        # literally it would reach the charset guard below and stop the release, and a document
        # naming a variable would be worse than none. So the expansion is resolved against the
        # global `ARG` defaults collected above.
        #
        # THE DEFAULT IS WHAT THE BUILD RESOLVED, which is the only reason this is truthful rather
        # than plausible: the `docker build` above passes no `--build-arg`, so a release rebuilds on
        # exactly the workspace image its tree carries — that is the whole point of the pin being a
        # committed line that qits-maintenance bumps, and it is why this document can be written
        # from the Dockerfile without asking the daemon what it just built.
        #
        # Braced form only. `FROM $WORKSPACE_IMAGE` is legal docker and is NOT resolved here; it
        # falls through to the guard below and stops the release with the ref printed, which is the
        # right failure — a silent half-resolution would publish an SBOM naming the wrong base. The
        # counter is the same insurance against a self-referential default.
        #
        # Resolved BEFORE the stage-alias skip, so an alias reached through an `ARG` is still
        # recognised as the alias it is and dropped rather than invented as an upstream.
        tries=0
        while :; do
          case "$base" in
            *'${'*) : ;;
            *) break ;;
          esac
          tries=$((tries + 1))
          if [ "$tries" -gt 16 ]; then
            echo "Dockerfile: FROM '$base' does not resolve" >&2; exit 1
          fi
          key=${base#*'${'}
          key=${key%%'}'*}
          value=$(arg_default "$key" "$global_args") || {
            echo "Dockerfile: FROM reads \${$key}, which has no global ARG default" >&2; exit 1
          }
          base="${base%%"\${$key}"*}$value${base#*"\${$key}"}"
        done

        for stage in $stages; do
          if [ "$base" = "$stage" ]; then base=''; break; fi
        done
        [ -n "$base" ] || continue
        # The ref reaches a JSON document and a purl, so its shape is checked the same way the
        # version was: a reference is the registry's own charset and nothing else. It is also what
        # catches an unresolved expansion, since `$`, `{` and `}` are not in that charset.
        case "$base" in
          ''|*[!a-zA-Z0-9._:/@-]*)
            echo "Dockerfile: unusable FROM '$base'" >&2; exit 1 ;;
        esac
        # DISTINCT BASES ONLY — two stages built from one upstream are one dependency.
        case " $seen " in
          *" $base "*) continue ;;
        esac
        seen="$seen $base"

        case "$base" in
          # A digest ref pins harder than a tag, so the digest IS the version.
          *@*)
            name=${base%@*}
            tag=${base##*@}
            ;;
          *)
            # An untagged `FROM` means `latest` by definition. The colon is not proof of a tag: a
            # registry host may carry a port, and in `host:5000/image` the colon is the port's —
            # which is not hypothetical here, the base is `registry.dev.localhost:8080/qits/...`.
            tag=${base##*:}
            case "$base" in
              *:*) : ;;
              *) tag='' ;;
            esac
            case "$tag" in
              */*) tag='' ;;
            esac
            if [ -n "$tag" ]; then
              name=${base%:*}
            else
              name=$base
              tag=latest
            fi
            ;;
        esac

        purl="pkg:docker/$name@$tag"
        components="$components$sep$(printf \
          '{"type":"container","bom-ref":"%s","name":"%s","version":"%s","purl":"%s"}' \
          "$purl" "$name" "$tag" "$purl")"
        depends="$depends$sep$(printf '"%s"' "$purl")"
        sep=','
      done
      if [ -z "$components" ]; then
        echo "Dockerfile declares no base image" >&2; exit 1
      fi

      # THE BASE IS NOT THE WHOLE STORY HERE, and this is where the document departs from the two
      # siblings it is modelled on. Their images are a `FROM` plus `apt`/`apk`, and a package
      # inventory is not something a release step can honestly hand-build; this image is a `FROM`
      # plus exactly ONE artifact, fetched from a named URL under a committed checksum. Omitting it
      # would publish a document saying the editor image adds nothing to the workspace — the one
      # thing about it anybody opens an SBOM to learn.
      #
      # THE ARG NAMES ARE A CONTRACT WITH Dockerfile, exactly as the base-pin line is one with
      # qits-maintenance. Rename or drop either and this step stops the release, rather than quietly
      # publishing a document that no longer mentions the editor.
      #
      # `pkg:generic` because there is no ecosystem to name: this is a GitHub release asset, not a
      # package in a registry anybody resolves. qits-maintenance stores a purl type it does not
      # inventory with a null ecosystem — shown, never matched — which is exactly the treatment this
      # component wants. The checksum travels as a CycloneDX hash instead of a purl qualifier: it is
      # the stronger identifier, and the URL it would qualify is itself an unexpanded `ARG`.
      editor_version=$(arg_default OPENVSCODE_VERSION "$stage_args") \
        || { echo "Dockerfile: no ARG OPENVSCODE_VERSION with a default" >&2; exit 1; }
      editor_sha=$(arg_default OPENVSCODE_SHA256 "$stage_args") \
        || { echo "Dockerfile: no ARG OPENVSCODE_SHA256 with a default" >&2; exit 1; }
      case "$editor_version" in
        ''|*[!0-9.]*)
          echo "Dockerfile: unusable OPENVSCODE_VERSION '$editor_version'" >&2; exit 1 ;;
      esac
      # 64 lowercase hex and nothing else — the shape `sha256sum -c` in the build already insists
      # on, checked again because from here it is a JSON value rather than a filename's sum.
      case "$editor_sha" in
        *[!0-9a-f]*)
          echo "Dockerfile: unusable OPENVSCODE_SHA256 '$editor_sha'" >&2; exit 1 ;;
      esac
      [ ${#editor_sha} -eq 64 ] \
        || { echo "Dockerfile: OPENVSCODE_SHA256 is not 64 hex characters" >&2; exit 1; }

      editor_purl="pkg:generic/openvscode-server@$editor_version"
      components="$components$sep$(printf \
        '{"type":"application","bom-ref":"%s","name":"openvscode-server","version":"%s",' \
        "$editor_purl" "$editor_version")$(printf \
        '"purl":"%s","hashes":[{"alg":"SHA-256","content":"%s"}]}' \
        "$editor_purl" "$editor_sha")"
      depends="$depends$sep$(printf '"%s"' "$editor_purl")"

      # CycloneDX 1.6: the image this run pushed as the metadata component, one container component
      # per distinct base plus the editor, and a single dependency edge from the root to all of
      # them. Appends rather than one unreadable format string; every value goes through `%s`, so
      # nothing in a ref can be read as a printf directive.
      #
      # THE ROOT IS THE DECLARED NAME, unqualified — `artifacts:` above says
      # `{type: docker, name: qits/workspace-editor}`, and that is the coordinate a SoftwareRelease
      # consumer asks for, `packageName` verbatim. The components keep the refs the build actually
      # resolved, registry host and all, because that is what this image is really made of.
      root="pkg:docker/qits/workspace-editor@$version"
      printf '{"bomFormat":"CycloneDX","specVersion":"1.6","version":1,' > sbom.json
      printf '"metadata":{"component":{"type":"container","bom-ref":"%s",' "$root" >> sbom.json
      printf '"name":"qits/workspace-editor","version":"%s","purl":"%s"}},' \
        "$version" "$root" >> sbom.json
      printf '"components":[%s],"dependencies":[{"ref":"%s","dependsOn":[%s]}]}\n' \
        "$components" "$root" "$depends" >> sbom.json

      # The store is a sibling path of the npm registry inside the qits-artifacts deployment, so its
      # root is DERIVED from $QITS_NPM_REGISTRY_URL — the qits-net alias every step carries, and the
      # one this container can actually dial. NOT $QITS_REGISTRY: that is the host-published name
      # the docker daemon pushes through, and the edge in front of it 401s every sessionless write
      # since the commissioned-credentials cutover (measured twice on 2026.902.53027). ci-base
      # carries curl, so the PUT goes out from this step directly — no helper container, and none of
      # the `--network container:$(hostname)` borrowing qits-build-images-oci needs because its own
      # step image is dind and has no curl.
      #
      # THE PATH SEGMENT IS THE DECLARED NAME, VERBATIM: qits-maintenance reads this document at
      # `/artifacts/sboms/{packageType}/{packageName}/-/{version}` composed from the SoftwareRelease
      # it saw, so `docker/qits/workspace-editor` here and `{type: docker, name: qits/workspace-
      # editor}` above are one string written twice. `-f` is what makes a refusal red rather than a
      # stored error page.
      sbom_base="${QITS_NPM_REGISTRY_URL%%/artifacts/*}/artifacts/sboms"
      curl -fsS -X PUT -H 'Content-Type: application/vnd.cyclonedx+json' \
        --data-binary @sbom.json \
        "$sbom_base/docker/qits/workspace-editor/-/$version"
