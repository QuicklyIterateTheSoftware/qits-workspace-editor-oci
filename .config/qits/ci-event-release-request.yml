# THE ONE QA PIPELINE THIS REPOSITORY HAS, and it runs for a release request and nothing else.
#
# There is no push pipeline any more, and `ci-post-receive.yml` is what this file replaces.
# qits-projects keeps a backing branch `release/<id>` per open release request — an octopus merge of
# that request's sources, refolded whenever the set changes — and publishes `ReleaseRequestChanged`
# on every successful re-fold. The merge primitive that writes that branch fires no `post-receive`
# and so publishes no `SCMPublishCommit`: without this file the fold exists and NOTHING BUILDS IT.
# A fold the git host answered `unchanged`, and one that conflicted, publish nothing — so every
# arrival here is a new sha worth a build.
#
# DECIDED AT MAIN, BUILT AT THE FOLD. This file is discovered, parsed and selected at `main`'s head,
# always; only the run's branch and sha come from the payload, which is why `checkout:` names them
# as a pair — a sha with no branch whose history holds it is not something a step container can
# fetch. A release request therefore cannot alter the CI that gates it by folding in a commit that
# edits this file. Inside a step, $QITS_CI_BRANCH is `release/<id>` and $QITS_CI_SHA is the merged
# sha; the fold is already checked out, so nothing below fetches or switches refs.
#
# EVERY STEP HERE IS GATING, INCLUDING THE ONE THAT PUSHES AN IMAGE. It stays in the gating half on
# purpose: whatever a run publishes is published before anything later can fail. The coordinate it
# pushes is the MERGED SHA, which no `ReleaseRequestChanged` is ever derived from, so this pipeline
# cannot re-trigger itself; and a redelivered event re-pushes identical content under the same tag,
# which is why nothing here treats an existing tag as an error. The verdict returns on the ordinary
# `BuildSuccessful`/`BuildFailed` with `commitSha` = the merged sha, which is what qits-projects'
# `BuildStatusListener` matches on together with `repoId`.
#
# ci-event-release.yml BESIDE THIS FILE IS UNTOUCHED and is still the other half: it reacts to this
# repository's release TAG and publishes the released coordinate. This file names a build by the
# merged sha; that one names a release by its version. Neither pushes the other's coordinate.
#
# One step: build the image and push it under the merged sha.
#
# THERE IS NO TEST STEP AND NOTHING IS MISSING. This repository holds a Dockerfile and no code: no
# pom, no package.json, nothing a `verify` could run. The build IS the test — a broken `FROM`, a
# moved download URL, a re-uploaded release asset with a different checksum, all fail here on the
# fold that carries the change rather than at release time when the answer arrives with nothing to
# do about it.
#
# THE IMAGE NAME IS NOT THE REPOSITORY NAME. This publishes `qits/workspace-editor`, the same split
# `qits-workspace-oci` publishing `qits/workspace-base` and `qits-workspace-daemon` publishing
# `qits/workspace` already record: the repository name is where the recipe lives, the image name is
# what the recipe produces and what qits-workspaces writes when it starts a container from it.
#
# ONE TAG PER PIPELINE. Do not add a second `-t` and a second push here. A sibling repository tried
# `docker build -t A -t B` then pushed both, and the second push failed with "tag does not exist":
# BuildKit's exporter does not reliably leave every alias of a multi-tag build in the local image
# store. Split the coordinates instead — this pipeline owns the sha, ci-event-release.yml owns the
# version.
#
# WHY THE IMAGE STEP DECLARES `docker: true`: it hands the step the HOST daemon's socket, which is
# the side this Dockerfile is written for. Its base — the pinned `qits/workspace` on
# `registry.dev.localhost:8080` — is an address the host daemon resolves and nothing inside this
# step's container can.
#
# No `--network` flag. The build does dial the internet (the openvscode-server tarball comes from
# GitHub) but it dials nothing on the PLATFORM, which is what that flag is ever added for: the
# default bridge reaches the outside, and the one platform address in the Dockerfile is the base
# reference, which is the host daemon's to pull and not the build's.
#
# No `--secret` flags either. This build mounts no credential — no Maven resolve, no npm install, no
# platform repository — so there is nothing for buildx to feed. The sibling image builds carry the
# commissioned pair because their builder stages might need it; this one has no builder stage.
#
# THE TIMEOUT IS THE SIBLINGS'. The base alone is the ~3.4 GB workspace image, pulled and pushed
# again with one layer on top, plus a ~77 MB download. images/qits-oci-workspace found an hour short
# of headroom for those bytes on a cold cache and qits-workspace-daemon matched it; there is no
# reason for this repository to be the optimist.
#
# THE BUMP TRAIN REACHES THIS FILE THROUGH A RELEASE REQUEST NOW, NOT THROUGH A PUSH.
# qits-maintenance follows a `qits/workspace` release by rewriting the base pin in Dockerfile and
# pushing `maintenance/qits-workspace-daemon` — a hop file here did that until 2026-09-03; it is one
# row in the maintenance inventory now (README.md, "How the base pin moves"). That push builds
# nothing on its own — there is no push pipeline left to catch it — so the branch is a SOURCE, and it
# is built here when qits-maintenance names it in a release request and qits-projects folds it. What
# used to follow the build was a second step asking the qits-workspaces release door; qits-maintenance
# opens the release request itself, with its own credential. Two callers for one release was one too
# many, so the step is gone and the build is all this pipeline owes the train.

event: ReleaseRequestChanged

when:
  # repoName, not repoId: the git host's storage coordinate is an opaque UUID since
  # the identity cutover, so a name match on repoId is not dependable. The event
  # echoes the public name; a rename updates this line in the same campaign.
  - repoName: { exact: qits-workspace-editor-oci }

checkout:
  branch: backingBranch
  sha: mergedSha

steps:
  - image: qits/build-images/ci-base:latest
    docker: true
    timeout-seconds: 7200
    script: |
      # `set -eu` is load-bearing rather than tidy: the daemon runs the script with `bash -c` and no
      # -e, so without it a failed build is swallowed by the next command's exit code — the push
      # fails or runs on a stale local image, and the run reports SUCCESS for an image that was never
      # built. -u makes an unset registry variable stop the step rather than composing a reference
      # out of empty strings.
      set -eu
      ref="$QITS_REGISTRY/$QITS_IMAGE_REPOSITORY/workspace-editor:$QITS_CI_SHA"
      docker build -t "$ref" -f Dockerfile .
      docker push "$ref"
      # NO `docker rmi "$ref"`: on a CI host it frees nothing — the layers stay in the builder's
      # cache either way — while under the containerd image store it drops the last reference to
      # content a concurrent build of this same Dockerfile may still be resolving. Two builds of
      # this one Dockerfile do run concurrently — a re-fold landing while the previous one is still
      # building, or this file and ci-event-release.yml overlapping — which is the shape of the race
      # that broke the release of 2026-08-11, back when the two were a push and an environment
      # branch.
