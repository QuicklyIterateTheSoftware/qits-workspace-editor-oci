# The pipeline qits-ci runs on every push to a tracked branch of this repository.
#
# One step, on every branch: build the image and push it under the built sha.
#
# THERE IS NO TEST STEP AND NOTHING IS MISSING. This repository holds a Dockerfile and no code: no
# pom, no package.json, nothing a `verify` could run. The build IS the test — a broken `FROM`, a
# moved download URL, a re-uploaded release asset with a different checksum, all fail here on the
# push that caused them rather than at release time when the answer arrives with nothing to do
# about it.
#
# THE IMAGE NAME IS NOT THE REPOSITORY NAME. This publishes `qits/workspace-editor`, the same split
# `qits-workspace-oci` publishing `qits/workspace-base` and `qits-workspace-daemon` publishing
# `qits/workspace` already record: the repository name is where the recipe lives, the image name is
# what the recipe produces and what qits-workspaces writes when it starts a container from it.
#
# ONE TAG PER PIPELINE. Do not add a second `-t` and a second push here. A sibling repository tried
# `docker build -t A -t B` then pushed both, and the second push failed with "tag does not exist":
# BuildKit's exporter does not reliably leave every alias of a multi-tag build in the local image
# store. Split the coordinates instead — this pipeline owns the sha, ci-event-release.yml owns the
# version.
#
# WHY THE IMAGE STEP DECLARES `docker: true`: it hands the step the HOST daemon's socket, which is
# the side this Dockerfile is written for. Its base — the pinned `qits/workspace` on
# `registry.dev.localhost:8080` — is an address the host daemon resolves and nothing inside this
# step's container can.
#
# No `--network` flag. The build does dial the internet (the openvscode-server tarball comes from
# GitHub) but it dials nothing on the PLATFORM, which is what that flag is ever added for: the
# default bridge reaches the outside, and the one platform address in the Dockerfile is the base
# reference, which is the host daemon's to pull and not the build's.
#
# No `--secret` flags either. This build mounts no credential — no Maven resolve, no npm install, no
# platform repository — so there is nothing for buildx to feed. The sibling image builds carry the
# commissioned pair because their builder stages might need it; this one has no builder stage.
#
# THE TIMEOUT IS THE SIBLINGS'. The base alone is the ~3.4 GB workspace image, pulled and pushed
# again with one layer on top, plus a ~77 MB download. images/qits-oci-workspace found an hour short
# of headroom for those bytes on a cold cache and qits-workspace-daemon matched it; there is no
# reason for this repository to be the optimist.
#
# THE BUMP TRAIN IS SOMEBODY ELSE'S ENTIRELY NOW, AND THIS FILE JUST BUILDS WHAT IT PUSHES.
# There is no hop file in this repository any more: qits-maintenance reads the `ARG WORKSPACE_IMAGE=`
# default in Dockerfile as an ordinary docker pin, notices a newer `qits/workspace`, rewrites the tag
# on its own branch and asks the release door itself. That branch still lands here for its build,
# which is the one thing this pipeline owes the train — the follow-up release step it used to carry
# is gone, because two callers for one release was one too many.
steps:
  - image: qits/build-images/ci-base:latest
    docker: true
    timeout-seconds: 7200
    script: |
      # `set -eu` is load-bearing rather than tidy: the daemon runs the script with `bash -c` and no
      # -e, so without it a failed build is swallowed by the next command's exit code — the push
      # fails or runs on a stale local image, and the run reports SUCCESS for an image that was never
      # built. -u makes an unset registry variable stop the step rather than composing a reference
      # out of empty strings.
      set -eu
      ref="$QITS_REGISTRY/$QITS_IMAGE_REPOSITORY/workspace-editor:$QITS_CI_SHA"
      docker build -t "$ref" -f Dockerfile .
      docker push "$ref"
      # NO `docker rmi "$ref"`: on a CI host it frees nothing — the layers stay in the builder's
      # cache either way — while under the containerd image store it drops the last reference to
      # content a concurrent build of this same Dockerfile may still be resolving. Two builds of
      # this one Dockerfile do run concurrently, main's and environment/dev's, which is the race
      # that broke the release of 2026-08-11.
