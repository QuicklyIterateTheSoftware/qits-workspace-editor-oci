# Filtered at build time — see pom.xml's <resources> block and WorkspaceEditorImage's javadoc. The
# value is this reactor's ${project.version}, which the release stamps with the version it is about
# to tag and push the image under, so the jar's version and the image tag are one string.
#
# Do NOT write a literal here. WorkspaceEditorImage refuses a value that still starts with `$`,
# which is what an unfiltered copy of this file looks like.
version=${project.version}
